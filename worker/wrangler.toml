name = "ratelimit-world"
main = "src/index.js"
compatibility_date = "2026-09-01"

# 正式なドメイン (Cloudflare が DNS レコードと証明書を自動で作る)。www は ratelimit.world へ移す
# ratelimit.world に既存の A レコードがあると作れないので、消してから有効にする
# routes = [
#   { pattern = "ratelimit.world", custom_domain = true },
#   { pattern = "www.ratelimit.world", custom_domain = true },
# ]
# 移行が終わるまで、古いアドレス (PC の CLI の送り先) も使えるようにしておく
workers_dev = true

[assets]
directory = "public"
binding = "ASSETS"
run_worker_first = false

[[d1_databases]]
binding = "DB"
database_name = "ratelimit-world"
database_id = "a6449fff-d9b0-4b7b-aa3e-f7c6e7c5fc62"

# リセット通知を時刻どおりに出すため、毎分起動する
[triggers]
crons = ["* * * * *"]

[vars]
VAPID_SUBJECT = "mailto:hello@ratelimit.world"
# 正式なドメイン。設定すると workers.dev で開いたページはここへ移り、PC の CLI も送り先を切り替える
# CANONICAL_ORIGIN = "https://ratelimit.world"
# ローカル開発用。本番では .dev.vars に書かず、未設定のままにする
# DEV_LOGIN = "1"

# secrets (wrangler secret put): GITHUB_CLIENT_ID / GITHUB_CLIENT_SECRET / VAPID_PUBLIC_KEY / VAPID_PRIVATE_KEY
